<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Séance du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101c17;
    --surface: #17251f;
    --surface-2: #1f3128;
    --ink: #eef1ea;
    --muted: #8fa89c;
    --accent: #e3d16a;
    --cta: #3f7a63;
    --cta-ink: #f4f2ec;
    --line: rgba(238,241,234,0.10);
    --cat-bas: #7fb37a;
    --cat-haut: #7aa7c9;
    --cat-core: #e3d16a;
    --cat-cardio: #a78bd9;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    overscroll-behavior: none;
  }

  #root{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .mono{ font-family: 'Space Mono', monospace; }

  .loading{
    flex:1; display:flex; align-items:center; justify-content:center;
    color: var(--muted); font-size: 14px; letter-spacing: 0.5px;
  }

  /* ---------- home ---------- */
  .kicker{
    font-family:'Space Mono', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .date-line{
    font-size: 15px; color: var(--muted); margin-bottom: 22px;
    text-transform: capitalize;
  }

  .day-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .day-card::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(238,241,234,0.035) 1px, transparent 1px);
    background-size: 5px 5px;
    pointer-events:none;
  }
  .day-num{
    font-family:'Space Mono', monospace;
    font-size: 13px; color: var(--accent); letter-spacing: 1px;
  }
  .day-title{
    font-size: 26px; font-weight: 800; margin: 4px 0 6px;
    letter-spacing: -0.3px;
  }
  .day-sub{
    font-size: 14px; color: var(--muted); margin-bottom: 20px;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Space Mono', monospace;
    font-size: 12px; color: var(--accent);
    background: rgba(227,209,106,0.1);
    border: 1px solid rgba(227,209,106,0.3);
    padding: 5px 12px; border-radius: 20px;
    margin-bottom: 18px;
  }

  .btn{
    display:block; width:100%;
    border:none; border-radius: 16px;
    font-family:'Manrope', sans-serif;
    font-weight: 700; font-size: 17px;
    padding: 18px; text-align:center;
    cursor:pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--cta); color: var(--cta-ink); }
  .btn-rest{ background: var(--surface-2); color: var(--muted); cursor:default; }

  .section-title{
    font-family:'Space Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin: 4px 0 12px;
  }

  .calendar{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }
  .cal-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 14px;
  }
  .cal-month{ font-weight: 800; font-size: 16px; text-transform: capitalize; }
  .cal-count{ font-family:'Space Mono', monospace; font-size: 12px; color: var(--muted); }

  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow{
    font-family:'Space Mono', monospace; font-size: 10px; color: var(--muted);
    text-align:center; padding-bottom: 4px;
  }
  .cal-cell{
    aspect-ratio: 1; border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-size: 12px;
    color: var(--muted); background: rgba(238,241,234,0.03);
    position:relative;
  }
  .cal-cell.empty{ background:none; }
  .cal-cell.today{ box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--ink); }
  .cal-cell.done{ background: rgba(63,122,99,0.35); color: var(--ink); }
  .cal-cell.done::after{
    content:"×"; position:absolute; font-size:16px; font-weight:700; color: var(--accent);
  }
  .cal-cell .num{ position:absolute; top:2px; left:4px; font-size:8px; opacity:0.6; }

  /* ---------- workout screen ---------- */
  .workout-screen{ flex:1; display:flex; flex-direction:column; }
  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 22px; }
  .back-link{
    font-family:'Space Mono', monospace; font-size: 13px; color: var(--muted);
    background:none; border:none; cursor:pointer; padding: 8px 0;
  }
  .timer{ font-family:'Space Mono', monospace; font-size: 20px; font-weight:700; color: var(--ink); letter-spacing: 1px; }

  .tour-dots{ display:flex; justify-content:center; gap: 10px; margin-bottom: 8px; }
  .dot{ width: 8px; height:8px; border-radius: 50%; background: var(--line); }
  .dot.filled{ background: var(--accent); }
  .dot.current{ box-shadow: 0 0 0 3px rgba(227,209,106,0.25); }

  .exo-counter{
    text-align:center; font-family:'Space Mono', monospace;
    font-size: 12px; color: var(--muted); margin-bottom: 16px;
  }

  .cat-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Space Mono', monospace; font-size: 11px; letter-spacing:1px;
    text-transform: uppercase; color: var(--muted);
    background: rgba(238,241,234,0.05);
    border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 20px;
    margin: 0 auto 14px; width: fit-content;
  }
  .cat-dot{ width:7px; height:7px; border-radius:50%; }

  .exo-stage{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding: 10px 0;
  }
  .exo-icon{
    width: 100%; max-width: 260px; aspect-ratio: 1 / 1;
    margin: 0 auto 14px; border-radius: 20px; overflow: hidden;
    background: var(--surface-2);
    display:flex; align-items:center; justify-content:center;
  }
  .exo-photo{ width:100%; height:100%; object-fit: cover; display:block; }
  .exo-pictogram{ display:none; width: 70%; height: 70%; }
  .exo-pictogram svg{ width:100%; height:100%; color: var(--accent); }

  .exo-name{ font-size: 26px; font-weight: 800; line-height:1.25; margin-bottom: 16px; letter-spacing:-0.4px; }
  .exo-reps{ font-family:'Space Mono', monospace; font-size: 44px; font-weight:700; color: var(--accent); }
  .exo-reps-label{ font-size: 13px; color: var(--muted); margin-top: 4px; }

  .sub-phase-label{
    font-family:'Space Mono', monospace; font-size: 13px; letter-spacing:1px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .sub-countdown{ font-family:'Space Mono', monospace; font-size: 64px; font-weight:700; color: var(--accent); }
  .sub-done{ font-size: 30px; font-weight: 800; color: var(--accent); }

  .waiting-note{
    text-align:center; font-family:'Space Mono', monospace; font-size: 12px;
    color: var(--muted); padding: 18px; letter-spacing: 0.5px;
  }

  /* ---------- congrats ---------- */
  .congrats{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .congrats-title{ font-size: 30px; font-weight: 800; margin-bottom: 10px; }
  .congrats-phrase{
    font-family:'Space Mono', monospace; font-size: 15px; color: var(--accent);
    margin-bottom: 10px; letter-spacing: 0.3px;
  }
  .congrats-sub{ color: var(--muted); font-size: 15px; margin-bottom: 36px; }
  .congrats-time{ font-family:'Space Mono', monospace; font-size: 40px; font-weight:700; color: var(--accent); margin-bottom: 6px; }
  .congrats-time-label{ font-family:'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom: 40px; }
</style>
</head>

<script>
(function(){

  // ---------- Pictograms (movement families, reused across similar exercises) ----------
  const ICON_DEFS = {
    squat: `<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="47" y2="52"/><line x1="47" y1="52" x2="30" y2="58"/><line x1="30" y1="58" x2="34" y2="86"/><line x1="47" y1="52" x2="64" y2="58"/><line x1="64" y1="58" x2="60" y2="86"/><line x1="49" y1="30" x2="26" y2="38"/><line x1="49" y1="30" x2="72" y2="38"/>`,
    lunge: `<circle cx="38" cy="16" r="8"/><line x1="38" y1="24" x2="42" y2="50"/><line x1="42" y1="50" x2="58" y2="55"/><line x1="58" y1="55" x2="60" y2="82"/><line x1="42" y1="50" x2="22" y2="62"/><line x1="22" y1="62" x2="14" y2="86"/><line x1="40" y1="28" x2="20" y2="22"/><line x1="40" y1="28" x2="62" y2="34"/>`,
    hinge: `<circle cx="35" cy="20" r="8"/><line x1="35" y1="28" x2="55" y2="48"/><line x1="55" y1="48" x2="50" y2="80"/><line x1="55" y1="48" x2="60" y2="80"/><line x1="40" y1="34" x2="20" y2="52"/><line x1="40" y1="34" x2="30" y2="20"/>`,
    push: `<circle cx="20" cy="55" r="8"/><line x1="27" y1="58" x2="78" y2="63"/><line x1="40" y1="59" x2="40" y2="83"/><line x1="70" y1="62" x2="82" y2="83"/>`,
    pull: `<circle cx="30" cy="20" r="8"/><line x1="30" y1="28" x2="48" y2="50"/><line x1="48" y1="50" x2="44" y2="82"/><line x1="48" y1="50" x2="55" y2="82"/><line x1="34" y1="34" x2="55" y2="30"/><line x1="55" y1="30" x2="70" y2="42"/><line x1="34" y1="36" x2="18" y2="68"/>`,
    pulldown: `<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="60"/><line x1="50" y1="60" x2="42" y2="86"/><line x1="50" y1="60" x2="58" y2="86"/><line x1="50" y1="30" x2="30" y2="14"/><line x1="50" y1="30" x2="70" y2="14"/>`,
    raise: `<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="60"/><line x1="50" y1="60" x2="42" y2="86"/><line x1="50" y1="60" x2="58" y2="86"/><line x1="50" y1="32" x2="20" y2="32"/><line x1="50" y1="32" x2="80" y2="32"/>`,
    curl: `<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="60"/><line x1="50" y1="60" x2="42" y2="86"/><line x1="50" y1="60" x2="58" y2="86"/><line x1="50" y1="30" x2="66" y2="46"/><line x1="66" y1="46" x2="52" y2="30"/>`,
    plank: `<circle cx="18" cy="50" r="8"/><line x1="25" y1="52" x2="80" y2="58"/><line x1="25" y1="52" x2="25" y2="76"/><line x1="80" y1="58" x2="80" y2="83"/>`,
    crunch: `<circle cx="70" cy="55" r="8"/><line x1="63" y1="58" x2="45" y2="60"/><line x1="45" y1="60" x2="35" y2="45"/><line x1="35" y1="45" x2="46" y2="32"/><line x1="45" y1="60" x2="55" y2="80"/>`,
    stability: `<circle cx="25" cy="40" r="8"/><line x1="30" y1="45" x2="70" y2="50"/><line x1="45" y1="48" x2="45" y2="75"/><line x1="65" y1="50" x2="65" y2="75"/><line x1="30" y1="45" x2="12" y2="33"/><line x1="70" y1="50" x2="90" y2="64"/>`,
    cardio: `<circle cx="20" cy="50" r="8"/><line x1="27" y1="52" x2="78" y2="58"/><line x1="27" y1="52" x2="27" y2="78"/><line x1="78" y1="58" x2="56" y2="44"/><line x1="56" y1="44" x2="76" y2="82"/>`,
    calf: `<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="60"/><line x1="50" y1="60" x2="46" y2="83"/><line x1="50" y1="60" x2="54" y2="83"/><line x1="50" y1="30" x2="35" y2="40"/><line x1="50" y1="30" x2="65" y2="40"/><path d="M40,87 Q50,79 60,87" fill="none"/>`,
  };
  function iconSvg(key){
    return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${ICON_DEFS[key]||''}</svg>`;
  }

  const CAT_LABELS = { bas:'Bas du corps', haut:'Haut du corps', core:'Core', cardio:'Cardio' };

  const DAYS = {
    1: { name: "Full body", sub: "Squats · rowing · pompes · gainage", exercises: [
      {name:"Squats élastique", img:"squats-elastique", category:"bas", icon:"squat", type:"reps", reps:"15"},
      {name:"Fentes alternées", img:"fentes-alternees", category:"bas", icon:"lunge", type:"reps", reps:"12 / jambe"},
      {name:"Rameur", img:"rowing-elastique", category:"haut", icon:"pull", type:"reps", reps:"15"},
      {name:"Pompes", img:"pompes", category:"haut", icon:"push", type:"reps", reps:"12"},
      {name:"Élévations latérales élastique", img:"elevation_lat_elastiquecpr", category:"haut", icon:"raise", type:"reps", reps:"12"},
      {name:"Curl", img:"curl", category:"bas", icon:"hinge", type:"reps", reps:"15"},
      {name:"Crunchs", img:"crunchs", category:"core", icon:"crunch", type:"reps", reps:"20"},
      {name:"Superman", img:"superman", category:"core", icon:"stability", type:"reps", reps:"15"},
    ]},
    2: { name: "Bas du corps + core", sub: "Fessiers · jambes · gainage", exercises: [
      {name:"Squats sumo élastique", img:"squats-sumo-elastique", category:"bas", icon:"squat", type:"reps", reps:"15"},
      {name:"Pont fessier élastique", img:"pont-fessier-elastique", category:"bas", icon:"hinge", type:"reps", reps:"15"},
      {name:"Fentes latérales", img:"fentes-laterales", category:"bas", icon:"lunge", type:"reps", reps:"10 / jambe"},
      {name:"Extension mollets", img:"extension-mollets", category:"bas", icon:"calf", type:"reps", reps:"20"},
      {name:"Gainage latéral", img:"gainage-lateral", category:"core", icon:"plank", type:"time", duration:25, sides:2},
      {name:"Vélo (crunchs croisés)", img:"velo-crunchs-croises", category:"core", icon:"crunch", type:"reps", reps:"20"},
      {name:"Superman tenu 2 s", img:"superman-tenu-2-s", category:"core", icon:"stability", type:"reps", reps:"12"},
    ]},
    3: { name: "Haut du corps + core", sub: "Pecs · dos · bras · abdos", exercises: [
      {name:"Développé élastique", img:"developpe-elastique", category:"haut", icon:"push", type:"reps", reps:"15"},
      {name:"Tirage vertical élastique", img:"tirage-vertical-elastique", category:"haut", icon:"pulldown", type:"reps", reps:"15"},
      {name:"Curl biceps élastique", img:"curl-biceps-elastique", category:"haut", icon:"curl", type:"reps", reps:"15"},
      {name:"Extension triceps élastique", img:"extension-triceps-elastique", category:"haut", icon:"curl", type:"reps", reps:"15"},
      {name:"Pompes", category:"haut", icon:"push", type:"reps", reps:"12"},
      {name:"Planche + touches d'épaule", img:"planche-touches-d-epaule", category:"core", icon:"plank", type:"reps", reps:"20 touches"},
      {name:"Crunchs obliques", img:"crunchs-obliques", category:"core", icon:"crunch", type:"reps", reps:"15 / côté"},
    ]},
    4: { name: "Full body — variation", sub: "Explosivité · tirage · poussée", exercises: [
      {name:"Squats avec levée de bras", img:"Squat_leve_bras", category:"cardio", icon:"squat", type:"reps", reps:"12"},
      {name:"Curl", img:"curl", category:"bas", icon:"hinge", type:"reps", reps:"15"},
      {name:"Rowing élastique unilatéral", img:"rowing", category:"haut", icon:"pull", type:"reps", reps:"12 / bras"},
      {name:"Pompes diamant", img:"pompes-diamant", category:"haut", icon:"push", type:"reps", reps:"10"},
      {name:"Élévations frontales élastique", img:"elevations_frontales_élastique", category:"haut", icon:"raise", type:"reps", reps:"12"},
      {name:"Mountain climbers", img:"mountain-climbers", category:"cardio", icon:"cardio", type:"reps", reps:"30"},
      {name:"Gainage", img:"gainage", category:"core", icon:"plank", type:"time", duration:45, sides:1},
    ]},
    5: { name: "Core + stabilité", sub: "Mobilité · gainage · équilibre", exercises: [
      {name:"Bird dog", img:"Bird_dog", category:"core", icon:"stability", type:"reps", reps:"12 / côté"},
      {name:"Levé de jambes", img:"Lever_jambes", category:"core", icon:"stability", type:"reps", reps:"12 / côté"},
      {name:"Pallof press élastique", img:"Paloffcpr", category:"core", icon:"stability", type:"reps", reps:"12 / côté"},
      {name:"Pont fessier", img:"Pont_fessiercpr", category:"bas", icon:"hinge", type:"reps", reps:"15"},
      {name:"Planche + extension de bras horizontale", img:"planche-extension-de-bras", category:"core", icon:"plank", type:"reps", reps:"12"},
      {name:"Rotation russe", img:"rotation-russe", category:"core", icon:"crunch", type:"reps", reps:"20"},
      {name:"Chat-vache dynamique", img:"CHat_vache", category:"core", icon:"stability", type:"reps", reps:"10"},
    ]},
    6: { name: "Full body — intensité", sub: "Cardio · puissance · gainage", exercises: [
      {name:"Squat + press élastique", img:"squat-press-elastique", category:"cardio", icon:"squat", type:"reps", reps:"15"},
      {name:"Renegade row", img:"renegade_rowcpr", category:"haut", icon:"pull", type:"reps", reps:"10 / bras"},
      {name:"Fentes sautées", img:"fentes-sautees", category:"cardio", icon:"lunge", type:"reps", reps:"10 / jambe"},
      {name:"Rowing élastique large", img:"rowing-elastique-large", category:"haut", icon:"pull", type:"reps", reps:"15"},
      {name:"Planche commando", img:"burpees-sans-saut", category:"cardio", icon:"cardio", type:"reps", reps:"10"},
      {name:"Gainage", img:"gainage", category:"core", icon:"plank", type:"time", duration:45, sides:1},
      {name:"Planche touche épaules", img:"superman-crunch-alterne", category:"core", icon:"crunch", type:"reps", reps:"20"},
    ]},
    7: { name: "Repos ou course", sub: "profites.", exercises: [] },
  };

  const END_PHRASES = [
    "Bravo !",
    "Peut mieux faire.",
    "Un peu de relâchement sur la fin.",
    "Incroyable.",
    "Tout simplement bluffant.",
    "Allez, tu la mérites ta douche.",
    "Oublie pas la douche gros dégueulasse.",
    "Feignasse va !",
    "Allez Raph, allez !",
    "Mou.",
    "Sacrés biscotos.",
    "Quelle perf !",
  ];

  const MS_DAY = 86400000;
  const todayISO = (d=new Date()) => {
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const fmtTime = (s) => {
    const m = Math.floor(s/60), sec = s%60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };

  let state = {
    screen: 'loading',
    startDate: null,
    log: [],
    dayIndex: 1,
    stepIndex: 0,
    sessionStart: null,
    timerSeconds: 0,
    timerHandle: null,
    finishedElapsed: 0,
    finishPhrase: '',
    sub: null, // { phase: 'prep'|'active'|'done', remaining, side }
  };

  let wakeLockSentinel = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLockSentinel = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* not supported / denied — ignore silently */ }
  }
  function releaseWakeLock(){
    try{ wakeLockSentinel && wakeLockSentinel.release(); }catch(e){}
    wakeLockSentinel = null;
  }

  function getStepInfo(){
    const day = DAYS[state.dayIndex];
    const n = day.exercises.length;
    const tour = Math.floor(state.stepIndex / n);
    const idx = state.stepIndex % n;
    return { day, n, tour, idx, exo: day.exercises[idx], totalSteps: n*3 };
  }

  function initSub(exo){
    if(exo && exo.type === 'time'){
      state.sub = { phase:'prep', remaining:5, side:1 };
    } else {
      state.sub = null;
    }
  }

  async function saveSession(){
    const session = { dayIndex: state.dayIndex, stepIndex: state.stepIndex, sessionStart: state.sessionStart };
    try{ await window.storage.set('session', JSON.stringify(session)); }catch(e){}
  }
  async function clearSession(){
    try{ await window.storage.delete('session'); }catch(e){}
  }

  function updateTimerDisplay(){
    state.timerSeconds = Math.floor((Date.now() - state.sessionStart) / 1000);
    const t = document.getElementById('timerDisplay');
    if(t) t.textContent = fmtTime(state.timerSeconds);
  }

  function updateSubText(){
    const el = document.getElementById('subCountdown');
    if(el && state.sub) el.textContent = state.sub.remaining;
  }

  function tick(){
    updateTimerDisplay();
    if(state.screen !== 'workout') return;
    const { exo } = getStepInfo();
    if(exo && exo.type === 'time' && state.sub && state.sub.phase !== 'done'){
      state.sub.remaining--;
      let transitioned = false;
      if(state.sub.remaining < 0){
        if(state.sub.phase === 'prep'){
          state.sub.phase = 'active';
          state.sub.remaining = exo.duration;
          transitioned = true;
        } else if(state.sub.phase === 'active'){
          if(state.sub.side < (exo.sides || 1)){
            state.sub.side++;
            state.sub.phase = 'prep';
            state.sub.remaining = 5;
            transitioned = true;
          } else {
            state.sub.phase = 'done';
            state.sub.remaining = 0;
            transitioned = true;
          }
        }
      }
      if(transitioned) renderWorkout(); else updateSubText();
    }
  }

  function startTimerLoop(){
    clearInterval(state.timerHandle);
    updateTimerDisplay();
    state.timerHandle = setInterval(tick, 1000);
  }

  async function loadData(){
    try{
      const sd = await window.storage.get('startDate');
      state.startDate = sd ? sd.value : null;
    }catch(e){ state.startDate = null; }
    if(!state.startDate){
      state.startDate = todayISO();
      try{ await window.storage.set('startDate', state.startDate); }catch(e){}
    }
    try{
      const lg = await window.storage.get('workoutLog');
      state.log = lg ? JSON.parse(lg.value) : [];
    }catch(e){ state.log = []; }

    const start = new Date(state.startDate + 'T00:00:00');
    const daysSince = Math.floor((new Date(todayISO()+'T00:00:00') - start) / MS_DAY);
    state.dayIndex = ((daysSince % 7) + 7) % 7 + 1;

    try{
      const s = await window.storage.get('session');
      if(s && s.value){
        const sess = JSON.parse(s.value);
        state.dayIndex = sess.dayIndex;
        state.stepIndex = sess.stepIndex;
        state.sessionStart = sess.sessionStart;
        state.screen = 'workout';
        initSub(getStepInfo().exo);
        startTimerLoop();
        requestWakeLock();
        render();
        return;
      }
    }catch(e){}

    state.screen = 'home';
    render();
  }

  async function saveLog(){
    try{ await window.storage.set('workoutLog', JSON.stringify(state.log)); }catch(e){}
  }

  async function startWorkout(){
    state.screen = 'workout';
    state.stepIndex = 0;
    state.sessionStart = Date.now();
    initSub(getStepInfo().exo);
    await saveSession();
    startTimerLoop();
    requestWakeLock();
    render();
  }

  async function nextStep(){
    const { exo, totalSteps } = getStepInfo();
    if(exo.type === 'time' && state.sub && state.sub.phase !== 'done') return; // guard, button hidden anyway
    if(state.stepIndex >= totalSteps - 1){
      finishWorkout();
      return;
    }
    state.stepIndex++;
    initSub(getStepInfo().exo);
    await saveSession();
    render();
  }

  async function finishWorkout(){
    clearInterval(state.timerHandle);
    releaseWakeLock();
    state.finishedElapsed = state.timerSeconds;
    state.finishPhrase = END_PHRASES[Math.floor(Math.random() * END_PHRASES.length)];
    const today = todayISO();
    if(!state.log.includes(today)){
      state.log.push(today);
      await saveLog();
    }
    await clearSession();
    state.screen = 'congrats';
    render();
  }

  function backToHome(){
    clearInterval(state.timerHandle);
    releaseWakeLock();
    state.screen = 'home';
    render();
  }

  async function abandonWorkout(){
    if(confirm("Quitter la séance en cours ?")){
      await clearSession();
      backToHome();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && state.screen === 'workout'){
      updateTimerDisplay();
      requestWakeLock();
    }
  });

  function buildCalendar(){
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
    const todayStr = todayISO();
    const monthName = now.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

    let doneCount = 0;
    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === todayStr;
      const isDone = state.log.includes(dateStr);
      if(isDone) doneCount++;
      cells += `<div class="cal-cell ${isDone?'done':''} ${isToday?'today':''}"><span class="num">${d}</span></div>`;
    }

    return `
      <div class="calendar">
        <div class="cal-header">
          <div class="cal-month">${monthName}</div>
          <div class="cal-count">${doneCount} séance${doneCount>1?'s':''}</div>
        </div>
        <div class="cal-grid">
          <div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">M</div>
          <div class="cal-dow">J</div><div class="cal-dow">V</div><div class="cal-dow">S</div><div class="cal-dow">D</div>
          ${cells}
        </div>
      </div>
    `;
  }

  function renderHome(){
    const day = DAYS[state.dayIndex];
    const today = todayISO();
    const doneToday = state.log.includes(today);
    const isRest = state.dayIndex === 7;
    const dateLabel = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

    let ctaHtml = '';
    if(isRest){
      ctaHtml = `<button class="btn btn-rest">Jour de repos — profites-en</button>`;
    } else if(doneToday){
      ctaHtml = `
        <div class="status-pill">✓ Séance déjà faite aujourd'hui</div>
        <button class="btn btn-primary" id="startBtn">Refaire la séance</button>
      `;
    } else {
      ctaHtml = `<button class="btn btn-primary" id="startBtn">Démarrer la séance</button>`;
    }

    document.getElementById('root').innerHTML = `
      <div class="kicker">Ton programme</div>
      <div class="date-line">${dateLabel}</div>
      <div class="day-card">
        <div class="day-num">Jour ${state.dayIndex} / 7</div>
        <div class="day-title">${day.name}</div>
        <div class="day-sub">${day.sub}</div>
        ${ctaHtml}
      </div>
      <div class="section-title">Ce mois-ci</div>
      ${buildCalendar()}
    `;

    const btn = document.getElementById('startBtn');
    if(btn) btn.onclick = startWorkout;
  }

  function renderWorkout(){
    const { day, n, tour, exo, totalSteps } = getStepInfo();
    const isLastStep = state.stepIndex === totalSteps - 1;

    let dots = '';
    for(let i=0;i<3;i++){
      const cls = i < tour ? 'dot filled' : (i === tour ? 'dot filled current' : 'dot');
      dots += `<div class="${cls}"></div>`;
    }

    const catColor = `var(--cat-${exo.category})`;

    let stageHtml = '';
    let buttonHtml = '';

    if(exo.type === 'reps'){
      stageHtml = `
        <div class="exo-reps mono">${exo.reps}</div>
        <div class="exo-reps-label">répétitions</div>
      `;
      buttonHtml = `<button class="btn btn-primary" id="nextBtn">${isLastStep ? 'Terminer la séance' : 'Suivant'}</button>`;
    } else {
      const sub = state.sub;
      if(sub.phase === 'prep'){
        const sideLabel = exo.sides > 1 ? ` — Côté ${sub.side === 1 ? 'gauche' : 'droit'}` : '';
        stageHtml = `
          <div class="sub-phase-label">Prépare-toi${sideLabel}</div>
          <div class="sub-countdown mono" id="subCountdown">${sub.remaining >= 0 ? sub.remaining : 0}</div>
        `;
        buttonHtml = `<div class="waiting-note">Le chrono démarre automatiquement…</div>`;
      } else if(sub.phase === 'active'){
        const sideLabel = exo.sides > 1 ? ` — Côté ${sub.side === 1 ? 'gauche' : 'droit'}` : '';
        stageHtml = `
          <div class="sub-phase-label">Maintiens${sideLabel}</div>
          <div class="sub-countdown mono" id="subCountdown">${sub.remaining >= 0 ? sub.remaining : 0}</div>
        `;
        buttonHtml = `<div class="waiting-note">Tiens bon jusqu'à 0…</div>`;
      } else {
        stageHtml = `<div class="sub-done">Terminé ✓</div>`;
        buttonHtml = `<button class="btn btn-primary" id="nextBtn">${isLastStep ? 'Terminer la séance' : 'Suivant'}</button>`;
      }
    }

    document.getElementById('root').innerHTML = `
      <div class="workout-screen">
        <div class="top-bar">
          <button class="back-link" id="abandonBtn">Quitter</button>
          <div class="timer mono" id="timerDisplay">${fmtTime(state.timerSeconds)}</div>
        </div>
        <div class="tour-dots">${dots}</div>
        <div class="exo-counter">Tour ${tour+1} / 3 · Exercice ${(state.stepIndex % n)+1} / ${n}</div>
        <div class="cat-pill"><span class="cat-dot" style="background:${catColor}"></span>${CAT_LABELS[exo.category]}</div>
        <div class="exo-stage">
          <div class="exo-icon"><img src="images/${exo.img}.jpg" alt="${exo.name}" class="exo-photo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="exo-pictogram">${iconSvg(exo.icon)}</div></div>
          <div class="exo-name">${exo.name}</div>
          ${stageHtml}
        </div>
        ${buttonHtml}
      </div>
    `;

    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = nextStep;
    document.getElementById('abandonBtn').onclick = abandonWorkout;
  }

  function renderCongrats(){
    document.getElementById('root').innerHTML = `
      <div class="congrats">
        <div class="congrats-title">Séance terminée 💪</div>
        <div class="congrats-phrase">${state.finishPhrase}</div>
        <div class="congrats-sub">3 tours complets.</div>
        <div class="congrats-time mono">${fmtTime(state.finishedElapsed)}</div>
        <div class="congrats-time-label">Temps total</div>
        <button class="btn btn-primary" id="homeBtn">Retour au menu</button>
      </div>
    `;
    document.getElementById('homeBtn').onclick = backToHome;
  }

  function render(){
    if(state.screen === 'home') renderHome();
    else if(state.screen === 'workout') renderWorkout();
    else if(state.screen === 'congrats') renderCongrats();
  }

  loadData();
})();
</script>
</body>
</html>
